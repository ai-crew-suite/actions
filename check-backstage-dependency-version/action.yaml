name: 'Shared Weekly Version Bump Engine'
description: 'Centralized engine to execute backstage-cli framework upgrades and compile automated tracking pull requests'

inputs:
  node-version:
    description: 'The Node.js runtime version to initialize'
    required: false
    default: '22'
  workflow-github-token:
    description: 'A GitHub access token with permission to trigger follow-up workflows and bypass branch protections'
    required: true

runs:
  using: 'composite'
  steps:
    - name: 🟢 Use Node.js \${{ inputs.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: \${{ inputs.node-version }}
        cache: 'yarn'

    # Non-immutable flags here to ensure that backstage-cli can safely
    # perform structural upgrades across lockfiles if prerequisites shift.
    - name: 📦 Install Workspace Dependencies
      shell: bash
      run: yarn install
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'

    - name: 🏎️ Initialize Turborepo Remote GitHub Actions Cache
      uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

    - name: 📦 Check Backstage Upstream Upgrades
      shell: bash
      run: yarn backstage-cli versions:bump
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'

    - name: 🚀 Automatically Orchestrate Branch and Create Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: \${{ inputs.workflow_github_token }}
        commit-message: "chore(deps): update backstage and rag plugin dependencies"
        committer: "ai-crew-suite-bot <bot@ai-crew-suite.dev>"
        author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
        signoff: false
        branch: "automated/update-dependencies"
        delete-branch: true
        title: "🔄 Update Core Dependencies & Upstream Framework"
        base: main
        body: |
          ### 🔄 Automated Backstage Dependency Upgrades
          This pull request updates our core framework modules and dependencies to align with the latest Backstage ecosystem release.

          - **Engine Hook**: Executed via `yarn backstage-cli versions:bump`
          - **Target Framework**: Managed under `@ai-crew-suite` workspaces

          *Automated thread dispatched by [create-pull-request](https://github.com/peter-evans/create-pull-request).*
        labels: |
          dependencies
          triage
        draft: false
