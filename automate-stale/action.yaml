name: 'Automate Stale Issues and PRs'
description: 'Centralized core engine to flag and close stale items across AI Crew Suite'

inputs:
  days-before-issue-stale:
    description: 'Idle days before an issue marks as stale'
    required: false
    default: '60'
  days-before-pr-stale:
    description: 'Idle days before a PR marks as stale'
    required: false
    default: '14'

runs:
  using: 'composite'
  steps:
    - name: 🛡️ Harden GitHub Actions Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: 🧹 Flag Stale Issues and Pull Requests
      uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
      with:
        # --- Issue Configurations ---
        stale-issue-message: >
          This issue has been automatically marked as stale because it has not had
          recent activity. It will be closed if no further activity occurs. Thank you
          for your contributions to the AI Crew Suite.
        days-before-issue-stale: ${{ inputs.days-before-issue-stale }}
        days-before-issue-close: 7
        stale-issue-label: stale
        exempt-issue-labels: >-
          plugin,
          after-vacations,
          kind/bug,
          kind/enhancement,
          triage

        # --- Pull Request Configurations ---
        stale-pr-message: >
          This PR has been automatically marked as stale because it has not had
          recent activity from the author. It will be closed if no further activity occurs.
          If the PR was closed and you want it re-opened, let us know
          and we'll re-open the PR so that you can continue the contribution!
        days-before-pr-stale: ${{ inputs.days-before-pr-stale }}
        days-before-pr-close: 7
        stale-pr-label: stale
        exempt-pr-labels: >-
          after-vacations,
          will-fix,
          dependencies

        # --- Operation Boundaries ---
        operations-per-run: 150
