approvedGitRepositories:
  - "**"

catalogs:
  # 🔵 Group 1: Production Runtime Dependencies
  prod:
    "@actions/core": "^3.0.1"
    "@actions/github": "^9.1.1"

  # 🟢 Group 2: Local Development & Tooling Dependencies
  dev:
    "@changesets/cli": "^3.0.3"
    "@tsconfig/node24": "24.0.5"
    "@types/node": "^26.6.2"
    "@typescript-eslint/eslint-plugin": "^8.70.0"
    "@typescript-eslint/parser": "^8.70.0"
    "eslint": "^10.11.0"
    "husky": "^9.1.7"
    "lint-staged": "^17.5.1"
    "prettier": "^3.9.8"
    "turbo": "^2.11.2"
    "typescript": "6.0.3"
    "vitest": "^5.0.1"
    "@playwright/test": "^1.44.0"

enableScripts: true

plugins:
  - path: .yarn/plugins/yarn-block-add.cjs
    spec: "./.yarn/plugins/yarn-block-add.cjs"

logFilters:
  - code: YN0002
    level: discard
  - code: YN0060
    level: discard
  - code: YN0086
    level: discard

nodeLinker: node-modules

npmMinimalAgeGate: 0
