nodeLinker: node-modules
yarnPath: .yarn/releases/yarn-4.18.0.cjs

plugins:
  - path: .yarn/plugins/yarn-block-add.cjs
    spec: ./.yarn/plugins/yarn-block-add.cjs

approvedGitRepositories:
  - "**"
enableScripts: true
npmMinimalAgeGate: 0

catalogs:
  prod:
    "@actions/core": ^3.0.1
    "@actions/github": ^9.1.1
  dev:
    "@changesets/cli": ^3.0.3
    "@playwright/test": ^1.44.0
    "@tsconfig/node24": 24.0.5
    "@types/node": ^26.6.2
    "@typescript-eslint/eslint-plugin": ^8.70.0
    "@typescript-eslint/parser": ^8.70.0
    "@vercel/ncc": ^0.45.0
    "eslint": ^10.11.0
    "husky": ^9.1.7
    "jiti": ^2.7.0
    "lint-staged": ^17.5.1
    "node-actionlint": ^1.2.2
    "prettier": ^3.9.8
    "turbo": ^2.11.2
    "typescript": 6.0.3
    "vite": ^8.3.0
    "vitest": ^5.0.1

logFilters:
  - code: YN0002
    level: discard
  - code: YN0060
    level: discard
  - code: YN0086
    level: discard
