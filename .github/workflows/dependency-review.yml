name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'hotfix/') }}
    steps:
      - name: 📂 Checkout Local Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Execute Local Dependency Check
        uses: ./dependency-review-check

  hotfix-bypass:
    name: Dependency Review Hotfix Bypass
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.head_ref || github.ref_name, 'hotfix/') }}
    steps:
      - name: 📂 Checkout Local Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🪵 Execute Local Bypass Registration
        uses: ./dependency-review-bypass
