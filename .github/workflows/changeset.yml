name: Changeset PRs

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    name: Create Changeset PR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          # Natively caches Yarn 4 installations across pipeline executions
          cache: "yarn"

      - name: 📦 Install Workspace Dependencies
        run: yarn install --immutable
        env:
          # Yarn 4 needs to know it is running inside non-interactive CI environments
          YARN_ENABLE_IMMUTABLE_INSTALLS: true

      # Run compile step so published artifacts exist
      - name: ⚡ Compile Local Actions via Turbo
        run: yarn build

      - name: 🚀 Create Release Pull Request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: yarn version
          pr-title: "Version Packages - actions suite"
          github-token: ${{ secrets.GITHUB_TOKEN }}
