# Runs Playwright E2E suite for merge-queue validation
# 🚨 TODO / DEPLOYMENT GATE NOTICE:
# Playwright requirements are currently running with 'pre_release_bypass: true'
# in early development to conserve build minutes. Turn off bypass before production launch.
name: Playwright

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    environment: testing
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'hotfix/') }}

    permissions:
      actions: write
      contents: read

    env:
      DEV_SERVER_HOST: localhost
      DEV_SERVER_PORT: ${{ vars.DEV_SERVER_PORT }}
      DISABLE_TELEMETRY: true
      FORCE_COLOR: 3
      PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}

    steps:
      - name: Dev Gate Alert Reminder
        run: |
          echo "::warning title=Early Development Mode::Playwright gating is NOT currently strictly enforced on deployments."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=22 <25"
          cache: "yarn"

      - name: Initialize Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Setup Python Virtual Environment
        run: yarn venv:setup

      - name: Install Workspace Dependencies
        uses: backstage/actions/yarn-install@2cd6978b476cbdc39fec48346f8b6ca13199dd6a # v0.7.8
        with:
          cache-prefix: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}

      - name: Initialize Turborepo Remote GitHub Actions Cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Build monorepo
        run: yarn turbo run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare mock auth file
        run: mkdir -p playwright/.auth && echo '{}' > playwright/.auth/login.json

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          CI: "1"
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  hotfix-bypass:
    name: E2E Test Hotfix Bypass
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.head_ref || github.ref_name, 'hotfix/') }}

    permissions: {}

    steps:
      - name: Skip E2E for hotfix branch
        run: echo "hotfix/* branch detected; skipping e2e workflow but allowing deployments."
